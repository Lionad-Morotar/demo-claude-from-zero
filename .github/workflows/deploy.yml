name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/website/pnpm-lock.yaml

      - name: 安装依赖
        run: cd packages/website && pnpm install --frozen-lockfile

      - name: 构建
        run: cd packages/website && pnpm build
        env:
          # GitHub Pages 子路径部署：/repo-name/
          # 若使用自定义域名（根路径），在仓库 Settings → Pages 中配置后，
          # 将此环境变量改为 '/' 或删除此行
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/website/.output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
